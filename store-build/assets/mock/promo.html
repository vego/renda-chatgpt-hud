<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{background:radial-gradient(120% 140% at 15% 10%,#16305a 0%,#0b1220 55%,#070b14 100%);color:#e7eef9;font-family:"Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
.wrap{display:flex;align-items:center;gap:calc(4vh);padding:0 6vw}
img{width:34vh;height:34vh;border-radius:6vh;box-shadow:0 0 6vh rgba(55,138,221,.45)}
h1{margin:0;font-size:15vh;letter-spacing:.04em;font-weight:700;line-height:1}
h1 b{color:#5aa7ff}
p{margin:2.5vh 0 0;font-size:5.6vh;color:#b5c3d8;line-height:1.35;max-width:62vw}
.chips{margin-top:3vh;display:flex;gap:1.6vh;flex-wrap:wrap}
.chips span{font-size:4vh;padding:.8vh 2vh;border:1px solid rgba(90,167,255,.5);border-radius:3vh;color:#cfe3ff;background:rgba(55,138,221,.12)}
.small p{display:none}.small .chips{display:none}.small h1{font-size:12.5vh}.small img{width:34vh;height:34vh}.small{gap:5vw;padding:0 5vw}
.small .sub{display:block}
.sub{display:none;font-size:6.6vh;color:#b5c3d8;margin-top:2vh}
</style></head><body><div class="wrap" id="w"><img src="icon.png"><div>
<h1>RENDA <b>HUD</b></h1>
<div class="sub">Bandă de lucru RENDA<br>pentru ChatGPT</div>
<p>Banda de lucru a echipelor RENDA, direct în ChatGPT.</p>
<div class="chips"><span>🤖 Agenți</span><span>🎯 Misiuni</span><span>📁 Proiecte</span><span>⚖ Reguli de lucru</span></div>
</div></div>
<script>if(location.search.includes('small'))document.getElementById('w').className='wrap small'</script>
</body></html>
